# ambed.ini - AMBEd settings
#
# Usage:     ambed /ambed/ambed.ini
# Reloaded:  every 3 minutes, most settings apply from the next stream
# Left out:  uses the default in main.h
# Bad value: logged and ignored
#
# Audio path:
#   decode -> <MODE>_TO_PCM -> bandpass filter -> AGC -> PCM_TO_<MODE> -> encode
#
# DMR covers YSF and NXDN too, they share a codec.

[Network]
# IP to bind to, 127.0.0.1 if xlxd is on this machine. Needs a restart.
LISTEN_IP=127.0.0.1

# UDP port, 1 to 65000. xlxd's TRANSCODER_PORT must match. Needs a restart.
LISTEN_PORT=10100

# Mark voice packets for QoS: 1 or 0
DSCP_MARKING_ENABLE=1

# DSCP value, 0 to 63. 46 is EF, highest priority voice
DSCP_VALUE=46

# Close a stream after this long with no packets, seconds, 1 to 60
STREAM_ACTIVITY_TIMEOUT=3

[Logging]
# Log levels when a stream closes: 1 or 0
TUNING_LOG=1

[Gain]
# Decode gains, in dB, -40 to +40. Bring every mode to the same level.
DSTAR_TO_PCM=-10
DMR_TO_PCM=-1.5
M17_TO_PCM=-10.75
P25_TO_PCM=-3.75

# Encode gains, in dB, -40 to +40. Set each mode's level on air.
PCM_TO_DSTAR=11.5
PCM_TO_DMR=0
PCM_TO_M17=5.25
PCM_TO_P25=0.75

[AGC]
# ------------------------------------------------------------------------
# Automatic gain control
#
# Evens out stations: a quiet radio comes up, a loud one comes down.
# It levels the speaker, not the syllable, so it should drift, never pump.
# Works like an HF receiver: fast down, hold through gaps, then up.
# Pauses and noise leave the gain alone.
# ------------------------------------------------------------------------

# AGC on or off: 1 or 0
USE_AGC=1

# Speech peak level to aim for, dBFS, -60 to -3
AGC_TARGET=-41

# Most the gain can move either way, dB, 0 to 20
# 0 leaves the audio alone and still logs speech peaks
AGC_CLAMPING=9

# How fast the gain comes down, ms, 10 to 2000
AGC_ATTACK=150

# How long the gain holds before it can rise, ms, 0 to 10000
AGC_HANG=1000

# How fast the gain rises, dB/s per dB below target, 0.1 to 10
# Far off comes up quickly, close eases in
AGC_RECOVERY=2

# Slowest rise, dB/s, 0.5 to 50
AGC_RECOVERY_MIN=3

# Fastest rise, dB/s, 0.5 to 100
AGC_RECOVERY_MAX=20

# Frames quieter than this don't move the gain, dBFS, -80 to -20
# Keep it above background noise
AGC_GATE=-60

[Filter]
# 300-3400 Hz bandpass on or off: 1 or 0
USE_BANDPASSFILTER=1
